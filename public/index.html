<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker</title>
    <style>
        body { margin:0; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#1a1a2e; }
        .login-box { background:white; padding:40px; border-radius:16px; text-align:center; max-width:400px; width:90%; }
        input { width:100%; padding:14px; border:2px solid #ddd; border-radius:8px; font-size:18px; margin-bottom:15px; }
        button { width:100%; padding:14px; background:#2c3e50; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
        .fallback { background:#ff4757; margin-top:10px; }
        button:active { transform:scale(0.95); }
    </style>
</head>
<body>
    <div id="login-screen" class="login-box">
        <h2>👋 Welcome!</h2>
        <p>Enter your name:</p>
        <input type="text" id="username-input" placeholder="Your name..." autofocus>
        <button id="join-btn" onclick="joinApp()">Join Now 🚀</button>
        <button class="fallback" onclick="joinApp()">📱 TAP HERE TO JOIN</button>
        <p style="margin-top:15px;font-size:12px;color:#999;">Click the red button if the blue one doesn't work</p>
    </div>

    <div id="map" style="width:100%;height:100%;position:fixed;top:0;left:0;z-index:0;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        console.log('🚀 App starting...');
        
        // ===== SIMPLE JOIN FUNCTION =====
        function joinApp() {
            console.log('🔥 joinApp called!');
            const input = document.getElementById('username-input');
            const username = input.value.trim() || 'Anonymous';
            console.log('👤 Username:', username);
            
            // Hide login
            document.getElementById('login-screen').style.display = 'none';
            
            // Connect to socket and send username
            const socket = io();
            socket.emit('set-username', username);
            
            // Start location tracking
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        socket.emit('send-location', {
                            latitude,
                            longitude,
                            device: '📱 Phone',
                            username: username
                        });
                    },
                    (err) => console.error('Location error:', err),
                    { enableHighAccuracy: true }
                );
            }
            
            // Show map
            const map = L.map('map').setView([40.7128, -74.0060], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            console.log('✅ Login successful!');
            alert('✅ Login successful! Welcome ' + username);
        }
        
        // Auto-focus on load
        setTimeout(() => {
            document.getElementById('username-input').focus();
        }, 500);
        
        // Enter key support
        document.getElementById('username-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                joinApp();
            }
        });
        
        // Make function global
        window.joinApp = joinApp;
        
        console.log('✅ App ready! Click the red button to join.');
    </script>
</body>
</html>
