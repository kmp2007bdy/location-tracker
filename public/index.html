<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Location Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <audio id="sound-message" preload="auto">
        <source src="https://www.soundjay.com/communication/electronic-chime-1-124506.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-sos" preload="auto">
        <source src="https://www.soundjay.com/emergency/air-raid-siren-1-102598.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-join" preload="auto">
        <source src="https://www.soundjay.com/communication/drop-1-101443.mp3" type="audio/mpeg">
    </audio>
</head>
<body>
    <h1>📍 Live Location Tracker</h1>

    <button id="dark-toggle" class="dark-toggle">🌙 Dark Mode</button>

    <div id="map-style-selector" class="map-style-selector">
        <button class="map-style-btn active" data-layer="carto">🗺️ Street</button>
        <button class="map-style-btn" data-layer="satellite">🛰️ Satellite</button>
        <button class="map-style-btn" data-layer="osm">🌍 OpenStreet</button>
        <button class="map-style-btn" data-layer="dark">🌙 Dark Map</button>
    </div>

    <div id="user-count" class="user-count">👥 <span id="count">0</span> users online</div>
    <div id="map"></div>

    <div id="sidebar" class="sidebar">
        <h4>👥 Online Users</h4>
        <div id="user-list"><div class="no-users">Loading...</div></div>
    </div>

    <div id="chat-container" class="chat-container">
        <div class="chat-header">💬 Live Chat</div>
        <div id="messages" class="chat-messages"><div class="no-messages">💬 Say hello!</div></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." class="chat-input">
            <button id="chat-send" class="chat-send">Send</button>
        </div>
    </div>

    <button id="sos-button" class="sos-button">🆘</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
